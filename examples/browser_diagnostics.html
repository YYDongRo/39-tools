<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent DevTools Failure Diagnostics</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 40px;
      }

      button {
        display: block;
        margin-bottom: 16px;
      }

      button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser action diagnostics</h1>
      <button id="visible-target" type="button">Visible target</button>
      <button id="error-target" type="button">JavaScript error target</button>
      <button class="ambiguous-target" type="button">First target</button>
      <button class="ambiguous-target" type="button">Second target</button>
      <button id="hidden-target" type="button" hidden>Hidden target</button>
      <button id="disabled-target" type="button" disabled>Disabled target</button>
      <h2>Fill diagnostics</h2>
      <input id="visible-input" value="">
      <input class="ambiguous-input" value="">
      <input class="ambiguous-input" value="">
      <input id="hidden-input" value="" hidden>
      <input id="disabled-input" value="" disabled>
      <input id="readonly-input" value="" readonly>
      <script>
        document.querySelector("#error-target").addEventListener("click", () => {
          console.error("player service unavailable");
          throw new Error("player initialization failed");
        });
      </script>
    </main>
  </body>
</html>
