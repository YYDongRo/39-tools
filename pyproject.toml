[project]
name = "39-tools"
version = "0.1.0"
description = "Action-level visual debugging and task verification for Browser Use and Playwright agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Roy Dong", email = "157320193+YYDongRo@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "ai-agents",
    "browser-automation",
    "computer-use",
    "debugging",
    "observability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/YYDongRo/39-tools"
Repository = "https://github.com/YYDongRo/39-tools"
Issues = "https://github.com/YYDongRo/39-tools/issues"

[project.optional-dependencies]
browser = [
    "playwright>=1.61.0",
]
browser-use = [
    "browser-use>=0.13.7,<0.14.0",
    "playwright>=1.61.0",
]
llm-openai = [
    "openai>=2.49.0",
]
llm-gemini = [
    "google-genai>=2.14.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "browser-use" },
        { extra = "llm-gemini" },
    ],
    [
        { extra = "browser-use" },
        { extra = "llm-openai" },
    ],
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_devtools"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
