[project]
name = "agent-devtools"
version = "0.1.0"
description = "Action-level observability and debugging for computer-use agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Roy Dong", email = "157320193+YYDongRo@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = [
    "playwright>=1.61.0",
]
browser-use = [
    "browser-use>=0.13.7,<0.14.0",
    "playwright>=1.61.0",
]
llm-openai = [
    "openai>=2.49.0",
]
llm-gemini = [
    "google-genai>=2.14.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "browser-use" },
        { extra = "llm-gemini" },
    ],
    [
        { extra = "browser-use" },
        { extra = "llm-openai" },
    ],
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
