# Agent DevTools configuration for the Browser Use observer.
#
# Copy this file to agent_devtools.toml. The included browser_use_cli.py loads
# it automatically; Python integrations pass the path to
# observe_browser_use_agent(..., config="agent_devtools.toml").
# The task still comes from the Browser Use Agent's task=... value.

[agent_devtools]

# Set to false to run the agent without creating traces or reports.
enabled = true

# Set to false to keep action/state evidence but skip before/after images.
screenshots = true

# Replace common credential-shaped values in recorded metadata. Screenshots
# are binary evidence and are not altered; review them before sharing.
redact_sensitive_data = true

# Set to false when the host application has its own terminal logging.
terminal_summary = true

# Set to true for local development. Keep false in CI and headless jobs.
open_report = false

# Set to true to compare each repeated evaluation with the latest evaluation
# of the same task. The first evaluation has no previous result to compare.
compare_previous = true

# Relative to the current working directory unless an absolute path is used.
trace_directory = "trace/browser-use"

# Root directory for repeated-run Browser Use evaluations.
evaluation_directory = "evaluations/browser-use"

# Browser choice for the included Browser Use examples.
# Leave this section out to use Playwright's managed Chromium (the default).
# To use an installed browser, set a path that exists in the environment
# running the command. Do not point this at your personal browser profile.
# Uncomment the section and use the path for your environment.
# [agent_devtools.browser]
# executable_path = "C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe"
# Linux example: "/usr/bin/brave-browser"
